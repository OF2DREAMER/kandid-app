<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kandid - Moment Capture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap");
        body { font-family: "Plus Jakarta Sans", sans-serif; background: #000000; color: #F4F4F5; }
        .font-mono-tag { font-family: "JetBrains Mono", monospace; }
        .no-scroll::-webkit-scrollbar { display: none; }
        .apple-blur { backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-[#050505] py-4">

    <!-- Mobile Screen Wrapper (390x844px) -->
    <div class="w-[390px] h-[844px] bg-[#000000] flex flex-col relative overflow-hidden border border-zinc-800/80 rounded-[40px] shadow-2xl justify-between">

        <!-- Full Screen Camera Viewfinder Background -->
        <div class="absolute inset-0 z-0 bg-zinc-950">
            <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=800&q=80" class="w-full h-full object-cover">
            
            <!-- Front Camera Picture-in-Picture (PiP) Window -->
            <div class="absolute top-24 right-5 w-24 h-32 bg-black rounded-2xl overflow-hidden border-2 border-white/20 shadow-2xl z-10">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover">
                <div class="absolute bottom-1.5 inset-x-0 text-center">
                    <span class="text-[7px] text-amber-400 font-mono-tag font-bold bg-black/70 px-1.5 py-0.5 rounded backdrop-blur-sm">DUAL CAMERA</span>
                </div>
            </div>

            <!-- Gradient Overlays for Readability -->
            <div class="absolute inset-x-0 top-0 h-48 bg-gradient-to-b from-black/80 via-black/30 to-transparent pointer-events-none z-10"></div>
            <div class="absolute inset-x-0 bottom-0 h-80 bg-gradient-to-t from-black/95 via-black/70 to-transparent pointer-events-none z-10"></div>
        </div>

        <!-- Top Header & HUD Overlay -->
        <div class="relative z-20 flex flex-col">
            <!-- Status Bar -->
            <div class="w-full pt-3 px-6 flex justify-between items-center text-[10px] text-zinc-400 bg-transparent">
                <span class="font-bold tracking-wider text-white font-mono-tag">09:41</span>
                <div class="w-20 h-4 bg-black rounded-full mx-auto"></div>
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span class="text-[9px] text-amber-500 font-mono-tag">LIVE</span>
                </div>
            </div>

            <!-- Kandid Header -->
            <header class="px-5 pt-2 pb-2 flex justify-between items-center">
                <h1 class="text-xs tracking-[0.25em] font-extrabold text-white uppercase font-mono-tag">KANDID</h1>
                <div class="flex items-center gap-2">
                    <button class="w-8 h-8 bg-black/40 apple-blur border border-white/10 rounded-full flex items-center justify-center text-zinc-300 hover:text-white transition-colors relative shadow-sm cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                        <span class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                    </button>
                    <div class="w-8 h-8 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-xs font-bold cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                </div>
            </header>

            <!-- Moment Window HUD Info -->
            <div class="px-5 pt-1 space-y-1">
                <h2 class="text-xs font-extrabold text-white tracking-widest uppercase font-mono-tag">KANDID MOMENT</h2>
                <div class="flex items-center justify-between">
                    <p class="text-[10px] text-zinc-400 font-mono-tag">YOUR MOMENT WINDOW</p>
                    <div class="bg-black/60 apple-blur border border-amber-500/40 px-2.5 py-1 rounded-lg">
                        <span class="text-[10px] text-amber-400 font-mono-tag font-bold">14:32 REMAINING</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty middle spacer to keep clean viewfinder view -->
        <div class="relative z-20 flex-1"></div>

        <!-- Bottom Shutter & Controls Dock -->
        <footer class="relative z-20 w-full pb-8 px-6 flex flex-col items-center space-y-4">
            
            <!-- Ambient Audio & ISO Info Row -->
            <div class="w-full flex justify-between items-center px-4">
                <div class="bg-black/60 apple-blur border border-white/10 px-3 py-1.5 rounded-xl flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                    <span class="text-[9px] text-zinc-300 font-mono-tag tracking-wider">AMBIENT AUDIO ON</span>
                </div>
                <div class="text-[9px] text-zinc-400 font-mono-tag bg-black/60 apple-blur border border-white/10 px-2.5 py-1.5 rounded-xl">
                    ISO 400 · 1/250s
                </div>
            </div>

            <!-- Helper Instruction -->
            <p class="text-[10px] text-zinc-400 font-mono-tag tracking-widest uppercase pt-1">
                TAP TO CAPTURE MOMENT
            </p>

            <!-- Bottom Action Row (Flash, Center Shutter, Flip Camera) -->
            <div class="w-full flex justify-between items-center px-6">
                <!-- Flash Control -->
                <button class="w-12 h-12 rounded-2xl bg-black/60 apple-blur border border-white/10 flex items-center justify-center text-white text-base hover:bg-black/80 transition-all cursor-pointer shadow-lg">
                    ⚡
                </button>

                <!-- Kandid Shutter Button (Amber) in Center -->
                <button class="relative group cursor-pointer">
                    <div class="w-20 h-20 bg-amber-500 hover:bg-amber-400 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(245,158,11,0.6)] transition-all p-1">
                        <div class="w-full h-full rounded-full border-2 border-black/30 flex items-center justify-center bg-amber-500">
                            <div class="w-5 h-5 bg-black rounded-full"></div>
                        </div>
                    </div>
                </button>

                <!-- Flip Camera Button -->
                <button class="w-12 h-12 rounded-2xl bg-black/60 apple-blur border border-white/10 flex items-center justify-center text-white text-lg hover:bg-black/80 transition-all cursor-pointer shadow-lg">
                    🔄
                </button>
            </div>

        </footer>

    </div>
</body>
</html>
