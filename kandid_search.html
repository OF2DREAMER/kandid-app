<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kandid - Search & Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000000; color: #F4F4F5; }
        .font-mono-tag { font-family: 'JetBrains Mono', monospace; }
        .no-scroll::-webkit-scrollbar { display: none; }
        .apple-blur { backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
        .search-box {
            background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-[#050505]">

    <!-- Mobile Screen Wrapper (390x844px) -->
    <div class="w-[390px] h-[844px] bg-[#09090b] flex flex-col relative overflow-hidden border border-zinc-800/80 rounded-[40px] shadow-2xl justify-between">

        <!-- Top Header & Search Navigation Container -->
        <div>
            <!-- Status Bar -->
            <div class="w-full pt-3 px-6 flex justify-between items-center text-[10px] text-zinc-400 z-30 bg-[#09090b]">
                <span class="font-bold tracking-wider text-white font-mono-tag">09:41</span>
                <div class="w-20 h-4 bg-black rounded-full mx-auto"></div>
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span class="text-[9px] text-amber-500 font-mono-tag">SEARCH</span>
                </div>
            </div>

            <!-- Editorial Header (56px Height Standard) -->
            <header class="bg-[#09090b]/90 apple-blur px-5 pt-2 pb-3 border-b border-zinc-800/80 z-30 space-y-3">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2.5">
                        <div class="w-7 h-7 bg-white text-black font-extrabold rounded-lg flex items-center justify-center text-sm shadow-md">
                            K
                        </div>
                        <h1 class="text-xs tracking-[0.25em] font-extrabold text-white uppercase font-mono-tag">KANDID</h1>
                    </div>

                    <!-- Quiet Notification Indicator -->
                    <button class="w-8 h-8 bg-zinc-900 border border-zinc-800 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition-colors relative shadow-sm cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                        <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-amber-500"></span>
                    </button>
                </div>

                <!-- Search Input Field -->
                <div class="search-box border border-zinc-800 rounded-2xl px-3.5 py-3 flex items-center gap-3">
                    <svg class="w-4 h-4 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" placeholder="SEARCH PEOPLE, PLACES, MOMENTS..." class="bg-transparent outline-none w-full text-white placeholder-zinc-500 text-[11px] font-medium font-mono-tag uppercase">
                </div>

                <!-- Discovery Filters (LIVE NOW | PLACES | PEOPLE | MOMENTS) -->
                <div class="flex justify-between items-center text-[10px] font-mono-tag text-zinc-400 px-1 pt-0.5">
                    <button class="text-amber-500 font-bold pb-1 border-b-2 border-amber-500">LIVE NOW</button>
                    <button class="hover:text-white transition-colors cursor-pointer">PLACES</button>
                    <button class="hover:text-white transition-colors cursor-pointer">PEOPLE</button>
                    <button class="hover:text-white transition-colors cursor-pointer">MOMENTS</button>
                </div>
            </header>
        </div>

        <!-- Main Discovery Content Stream -->
        <main class="flex-1 overflow-y-auto px-4 py-4 space-y-5 pb-32 no-scroll">
            
            <!-- Proximity / Discovery Radar Section -->
            <div class="bg-zinc-950 border border-zinc-800/80 rounded-2xl p-4 space-y-3 shadow-xl">
                <div class="flex justify-between items-center">
                    <span class="text-[9px] text-amber-500 font-mono-tag font-bold tracking-widest uppercase">PROXIMITY RADAR</span>
                    <span class="text-[9px] text-zinc-500 font-mono-tag">LOCATION-BASED DISCOVERY</span>
                </div>
                <!-- Abstract Minimal Radar Graphic Representation -->
                <div class="w-full h-24 bg-zinc-900/50 rounded-xl border border-zinc-800/80 relative flex items-center justify-center overflow-hidden">
                    <div class="absolute w-16 h-16 rounded-full border border-zinc-700/50 flex items-center justify-center">
                        <div class="w-8 h-8 rounded-full border border-amber-500/30 flex items-center justify-center">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span>
                        </div>
                    </div>
                    <!-- Ambient Radar Dots -->
                    <span class="absolute top-4 left-10 w-1.5 h-1.5 rounded-full bg-zinc-600"></span>
                    <span class="absolute bottom-6 right-12 w-1.5 h-1.5 rounded-full bg-zinc-500"></span>
                    <span class="absolute top-8 right-16 w-1 h-1 rounded-full bg-amber-500/80"></span>
                    <span class="absolute bottom-5 left-14 w-1.5 h-1.5 rounded-full bg-zinc-600"></span>
                    
                    <div class="absolute bottom-2.5 right-3 text-[9px] text-amber-400 font-mono-tag font-bold">
                        3 ACTIVE NODES
                    </div>
                </div>
            </div>

            <!-- Places / Discovery Sectors Section -->
            <div class="space-y-2.5">
                <span class="text-[9px] text-zinc-500 font-mono-tag tracking-widest uppercase px-1">SECTORS</span>
                <div class="grid grid-cols-1 gap-2">
                    <div class="bg-zinc-950 border border-zinc-800/80 rounded-2xl p-3.5 flex justify-between items-center shadow-lg hover:border-zinc-700 transition-colors cursor-pointer">
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] text-amber-500 font-mono-tag font-bold">01</span>
                            <h3 class="text-xs font-bold text-white tracking-wide">NORTH BLOCK</h3>
                        </div>
                        <span class="text-[10px] text-zinc-400 font-mono-tag">12 MOMENTS</span>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800/80 rounded-2xl p-3.5 flex justify-between items-center shadow-lg hover:border-zinc-700 transition-colors cursor-pointer">
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] text-amber-500 font-mono-tag font-bold">02</span>
                            <h3 class="text-xs font-bold text-white tracking-wide">THE UNION</h3>
                        </div>
                        <span class="text-[10px] text-zinc-400 font-mono-tag">8 MOMENTS</span>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800/80 rounded-2xl p-3.5 flex justify-between items-center shadow-lg hover:border-zinc-700 transition-colors cursor-pointer">
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] text-amber-500 font-mono-tag font-bold">03</span>
                            <h3 class="text-xs font-bold text-white tracking-wide">LIBRARY WING</h3>
                        </div>
                        <span class="text-[10px] text-zinc-400 font-mono-tag">5 MOMENTS</span>
                    </div>
                </div>
            </div>

            <!-- Trending Frequencies Section -->
            <div class="space-y-2.5">
                <span class="text-[9px] text-zinc-500 font-mono-tag tracking-widest uppercase px-1">FREQUENCIES</span>
                <div class="bg-zinc-950 border border-zinc-800/80 rounded-2xl p-4 space-y-3 shadow-lg">
                    <div class="flex justify-between items-center text-xs font-mono-tag pb-2 border-b border-zinc-900">
                        <span class="text-amber-400 font-bold">01 #MIDTERMS</span>
                        <span class="text-zinc-500">84 POSTS</span>
                    </div>
                    <div class="flex justify-between items-center text-xs font-mono-tag pb-2 border-b border-zinc-900">
                        <span class="text-amber-400 font-bold">02 #NIGHTWALK</span>
                        <span class="text-zinc-500">56 POSTS</span>
                    </div>
                    <div class="flex justify-between items-center text-xs font-mono-tag">
                        <span class="text-amber-400 font-bold">03 #FILMNOTES</span>
                        <span class="text-zinc-500">32 POSTS</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Navigation Bar with Kandid Orange Aperture Shutter Button -->
        <nav class="absolute bottom-4 left-4 right-4 bg-zinc-950/95 apple-blur border border-zinc-800/80 rounded-2xl px-5 py-2.5 flex justify-between items-center z-40 shadow-2xl">
            <!-- Feed Tab -->
            <a href="kandid_feed.html" class="text-zinc-500 hover:text-white flex flex-col items-center transition-colors cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[8px] mt-0.5 tracking-widest font-mono-tag">FEED</span>
            </a>
            <!-- Search Tab (Active) -->
            <button class="text-amber-500 flex flex-col items-center cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-[8px] mt-0.5 tracking-widest font-bold font-mono-tag">SEARCH</span>
            </button>
            
            <!-- Kandid Orange Aperture Shutter Button -->
            <button class="relative -top-4 group cursor-pointer">
                <div class="w-14 h-14 bg-amber-500 hover:bg-amber-400 rounded-full flex items-center justify-center shadow-[0_6px_20px_rgba(245,158,11,0.5)] transition-all">
                    <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path stroke-linecap="round" d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path>
                    </svg>
                </div>
            </button>

            <!-- Chat Tab -->
            <button class="text-zinc-500 hover:text-white flex flex-col items-center transition-colors cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <span class="text-[8px] mt-0.5 tracking-widest font-mono-tag">CHAT</span>
            </button>
            <!-- You Tab -->
            <button class="text-zinc-500 hover:text-white flex flex-col items-center transition-colors cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[8px] mt-0.5 tracking-widest font-mono-tag">YOU</span>
            </button>
        </nav>

    </div>
</body>
</html>
